# Where each persona runs.   <ip>  <runtime: compose|venv>  <personas, comma-separated>
# compose = Docker Compose container;  venv = Python venv + systemd service (hosts without Docker).
# 'chaos' = periodic rate-limit bursts on the agent-chaos key.
# .77/.78 are reserved for other use; .101 hosts LiteLLM and is short on RAM - keep agents off it.
192.168.1.100   compose   triage,sre,chaos
192.168.1.85    compose   analyst,news
192.168.1.75    venv      conversation
192.168.1.76    venv      reviewer
